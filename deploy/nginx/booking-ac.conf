# Nginx hanya mendengar di localhost; akses publik lewat Cloudflare Tunnel (cloudflared).
# macOS (Homebrew): /opt/homebrew/etc/nginx/servers/booking-ac.conf
# Linux:            /etc/nginx/sites-available/booking-ac (lalu symlink ke sites-enabled)

server {
    listen 127.0.0.1:8080;
    server_name _;

    # Ganti dengan path proyek di komputer server.
    root /Users/<user>/booking-ac/public;
    index index.php;

    client_max_body_size 40M;   # upload foto laporan (maks. 6 × 5 MB)
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        # macOS Homebrew php-fpm default: 127.0.0.1:9000; Linux: unix:/run/php/php8.2-fpm.sock
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
