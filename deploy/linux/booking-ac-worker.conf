; Supervisor (Linux): /etc/supervisor/conf.d/booking-ac-worker.conf
; sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start booking-ac-worker:*
[program:booking-ac-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/booking-ac/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/booking-ac
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/booking-ac/storage/logs/queue.log
stopwaitsecs=3600
