<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client — Tambah Alamat</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F4F7FC;color:#0B1533;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#1D63ED;text-decoration:none}a:hover{color:#1650C4}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.lbl{font-size:13px;font-weight:600;color:#33415C;display:block;margin-bottom:6px}
.inp{width:100%;min-height:48px;border:1.5px solid #E3E8F2;border-radius:12px;padding:12px 14px;font:inherit;font-size:14px;color:#0B1533;background:#FFFFFF}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;font-family:inherit;font-size:13px;font-weight:600;border:1.5px solid #E3E8F2;background:#FFFFFF;color:#33415C;cursor:pointer}

body{display:flex;justify-content:center}
</style>
</head>
<body>
<div style="width: 390px; height: 960px; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column; position: relative;">
  <div style="position: relative; height: 420px; background: #E9EEF5; overflow: hidden;">
    <svg width="390" height="420" viewBox="0 0 390 420" style="position: absolute; inset: 0;">
      <rect x="0" y="0" width="390" height="420" fill="#E9EEF5"></rect>
      <path d="M250 0 L390 0 L390 120 Q330 140 290 90 Q260 50 250 0Z" fill="#CFE3F7"></path>
      <rect x="24" y="250" width="110" height="80" rx="10" fill="#D4EDDC"></rect>
      <rect x="220" y="300" width="140" height="90" rx="10" fill="#D4EDDC"></rect>
      <path d="M-10 190 L400 150" stroke="#FFFFFF" stroke-width="22"></path>
      <path d="M160 -10 L200 430" stroke="#FFFFFF" stroke-width="18"></path>
      <path d="M-10 360 Q150 330 400 380" stroke="#FFFFFF" stroke-width="12"></path>
      <path d="M60 -10 L90 430" stroke="#FFFFFF" stroke-width="8"></path>
      <path d="M300 130 L330 430" stroke="#FFFFFF" stroke-width="8"></path>
      <path d="M-10 90 L400 70" stroke="#FFFFFF" stroke-width="7"></path>
      <path d="M-10 270 L400 245" stroke="#FFFFFF" stroke-width="7"></path>
      <path d="M-10 190 L400 150" stroke="#F7D98B" stroke-width="3" stroke-dasharray="1 0"></path>
      <circle cx="195" cy="215" r="70" fill="#1D63ED" fill-opacity="0.08" stroke="#1D63ED" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 5"></circle>
    </svg>
    <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 10px;">
      <button aria-label="Kembali" style="width: 48px; height: 48px; border-radius: 14px; border: 0; background: #FFFFFF; color: #0B1533; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,8,77,0.12);">
        <svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <label style="flex-grow: 1; height: 48px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 14px; box-shadow: 0 4px 14px rgba(0,8,77,0.12);">
        <svg class="ic" viewBox="0 0 24 24" style="color: #5B6780;"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input placeholder="Cari alamat atau nama jalan" aria-label="Cari alamat" style="border: 0; outline: none; font: inherit; font-size: 14px; flex-grow: 1; min-width: 0; background: transparent;">
      </label>
    </div>
    <div style="position: absolute; left: 195px; top: 215px; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center;">
      <div style="background: #00084D; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; white-space: nowrap;">Geser peta untuk atur titik</div>
      <svg width="44" height="54" viewBox="0 0 44 54"><path d="M22 52s18-16 18-30A18 18 0 0 0 4 22c0 14 18 30 18 30z" fill="#1D63ED" stroke="#FFFFFF" stroke-width="3"></path><circle cx="22" cy="22" r="7" fill="#FFFFFF"></circle></svg>
    </div>
    <div style="position: absolute; left: 195px; top: 215px; width: 14px; height: 6px; border-radius: 50%; background: rgba(0,8,77,0.25); transform: translate(-50%, -50%);"></div>
    <button aria-label="Gunakan lokasi saya" style="position: absolute; right: 16px; bottom: 44px; width: 48px; height: 48px; border-radius: 14px; border: 0; background: #FFFFFF; color: #1D63ED; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,8,77,0.12);">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 1v4M12 19v4M1 12h4M19 12h4"></path></svg>
    </button>
    <div style="position: absolute; left: 16px; bottom: 50px; font-size: 10px; color: #5B6780; background: rgba(255,255,255,0.8); padding: 2px 6px; border-radius: 4px;">Leaflet · © OpenStreetMap</div>
  </div>

  <div style="margin-top: -24px; background: #FFFFFF; border-radius: 24px 24px 0 0; position: relative; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1; box-shadow: 0 -6px 20px rgba(0,8,77,0.06);">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #D5DEEE; align-self: center;"></div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; background: #E3F6EC;">
      <svg class="ic" viewBox="0 0 24 24" style="color: #0F7B4F;"><path d="M20 6 9 17l-5-5"></path></svg>
      <div style="flex-grow: 1;">
        <div style="font-size: 14px; font-weight: 700; color: #0B5C3B;">Dalam jangkauan · 8,4 km</div>
        <div style="font-size: 12px; color: #0B5C3B;">Transport Rp12.000 (5 km pertama gratis)</div>
      </div>
    </div>
    <div>
      <span class="lbl">Label</span>
      <div style="display: flex; gap: 8px;">
        <button class="chip" style="background: #1D63ED; border-color: #1D63ED; color: #FFFFFF;">Rumah</button>
        <button class="chip">Kantor</button>
        <button class="chip">Lainnya</button>
      </div>
    </div>
    <div>
      <label class="lbl" for="alamat">Detail alamat</label>
      <textarea id="alamat" class="inp" rows="2" style="resize: none; line-height: 1.5;">Jl. Kemang Raya No. 12, Bangka, Mampang Prapatan, Jakarta Selatan</textarea>
    </div>
    <div>
      <label class="lbl" for="patokan">Patokan (opsional)</label>
      <input id="patokan" class="inp" value="Pagar hitam, sebelah minimarket">
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #5B6780;">
      <span class="num">Koordinat: -6.2607, 106.8136</span>
      <label style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #33415C; min-height: 44px;">
        <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #1D63ED;">
        Alamat utama
      </label>
    </div>
    <div style="flex-grow: 1;"></div>
    <button style="height: 54px; border-radius: 14px; border: 0; background: #1D63ED; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;">Simpan Alamat</button>
  </div>
</div>
</body>
</html>
